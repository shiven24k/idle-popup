<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src file: data:; style-src 'self'; script-src 'self'">
  <title>Idle Popup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="card" aria-live="polite">
    <div class="media">
      <img id="photo" alt="">
      <button id="close" type="button" aria-label="Dismiss" title="Dismiss">&#215;</button>
    </div>
    <div id="timer"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
